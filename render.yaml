# Render Blueprint. Free plan: no persistent disk, so SQLite is re-created and re-seeded on every start.
services:
  - type: web
    name: invoiceguard-india
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAYOUT_PROVIDER
        value: simulated   # labelled sandbox: no real money moves
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard, never commit (optional: the demo data is cached)
